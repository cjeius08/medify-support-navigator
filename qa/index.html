<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Notes · Isolated UI review</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#dde3e8;color:#162c3f;font:14px/1.4 Arial,sans-serif}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid #aebdca}label{display:flex;align-items:center;gap:6px}input,select,button{font:inherit;padding:6px;border:1px solid #aebdca;border-radius:4px}input{width:90px}main{overflow:visible;padding:16px;width:max-content;min-width:100%}iframe{display:block;border:0;min-height:0;background:white}small{color:#566675}
</style></head><body><header><strong>Isolated UI review</strong><small>Fictional records · no Supabase connection</small><label>Viewport width<input id="width" type="number" value="1280" min="320" max="2560"></label><label>Preset<select id="preset"><option>390</option><option>600</option><option>768</option><option>900</option><option>1024</option><option selected>1280</option><option>1440</option><option>1600</option><option>1920</option></select></label><label>Height<input id="height" type="number" value="900" min="320" max="1800"></label><button id="top">Top of preview</button><label>Screen<select id="screen"><option value="/?workspace">Workspace</option><option value="/?auth-preview">Sign-in</option></select></label></header><main><iframe id="preview" title="Application preview" src="/?workspace" width="1280" height="900"></iframe></main>
<script type="module">
  const frame=document.querySelector('#preview'), width=document.querySelector('#width');
  width.addEventListener('input',()=>{frame.width=width.value});
  document.querySelector('#preset').addEventListener('change',event=>{width.value=event.target.value;frame.width=event.target.value});
  document.querySelector('#height').addEventListener('input',event=>{frame.height=event.target.value});
  document.querySelector('#top').addEventListener('click',()=>{frame.contentWindow.scrollTo(0,0);window.scrollTo(0,0)});
  document.querySelector('#screen').addEventListener('change',event=>{frame.src=event.target.value});
</script></body></html>
